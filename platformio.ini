; StackChan x Meta Muse (M5Stack CoreS3)
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
; Reject invalid servo feedback in pinned BSP 1.1.0, including after reinstall.
extra_scripts = post:tools/patch_stackchan_bsp.py
monitor_speed = 115200
; App 5.75MB (with reading dictionaries) + LittleFS 10.1MiB for the voice pack.
; Same layout as stackchan-llm-mqtt-fft, so NVS and the voice pack survive flashing.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_files =
  dict/ja.dic
  dict/en.dic
build_unflags = -std=gnu++11
build_flags =
  -Iinclude
  -std=gnu++17
  -DUART_SCLK_DEFAULT=UART_SCLK_APB
lib_deps =
  m5stack/M5Unified@0.2.17
  https://github.com/stack-chan/m5stack-avatar.git#v0.10.0
  https://github.com/m5stack/StackChan-BSP.git#1.1.0
  bblanchon/ArduinoJson@^7.4.2
